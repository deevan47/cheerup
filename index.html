<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- cheerup.in/index.html and /gifts/index.html are the same pages as cheerup.in/
         and /gifts/. Clean the address bar first, so visitors, bookmarks and Analytics
         only ever see the short URL. -->
    <script>if(/\/index\.html$/.test(location.pathname))history.replaceState(null,'',location.pathname.slice(0,-10)+location.search+location.hash)</script>
    <!-- Google Analytics (GA4). The ID is the measurement ID from Analytics >
         Admin > Data streams. Page views on in-site navigation are recorded by GA4's
         "Enhanced measurement > Page changes based on browser history events", which
         is on by default, so the router does not send them itself. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T0KSG26KWF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T0KSG26KWF');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF5EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The two faces used above the fold. Preloaded by exact path, which is why the
         font files live in /public/fonts instead of being hashed by the bundler. -->
    <link rel="preload" href="/fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Cheer Up</title>
    <!--head--><!-- title, description, canonical, Open Graph and JSON-LD are written
         here per page by scripts/prerender.mjs, and kept up to date while you click
         around by lib/head.js. Do not add a <title> above. -->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
